<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APT//REDTEAM · Cybersecurity Learning Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080B12;
  --surface-1: #0F1420;
  --surface-2: #151C2B;
  --surface-3: #1C2436;
  --surface-hover: #1E293B;
  --surface-active: #22304A;
  --border: #253044;
  --border-light: #334155;
  --accent-primary: #8B5CF6;
  --accent-secondary: #38BDF8;
  --accent-glow: rgba(139, 92, 246, 0.15);
  --success: #22C55E;
  --success-bg: rgba(34, 197, 94, 0.12);
  --warning: #F59E0B;
  --warning-bg: rgba(245, 158, 11, 0.12);
  --danger: #EF4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --info: #3B82F6;
  --text: #F1F5F9;
  --text-muted: #94A3B8;
  --text-subtle: #64748B;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 280px;
  --topbar-h: 64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent-secondary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* App Shell */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
aside.sidebar {
  width: var(--sidebar-w);
  background: var(--surface-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 40;
  transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
}
.sidebar-header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-box {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.brand-logo-mark {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: white;
  font-family: var(--font-mono);
  font-size: 15px;
  letter-spacing: -0.5px;
  box-shadow: 0 0 12px var(--accent-glow);
}
.brand-title {
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.5px;
  color: var(--text);
  font-family: var(--font-mono);
}
.brand-title span { color: var(--accent-primary); }
.brand-badge {
  font-size: 10px;
  font-weight: 700;
  background: var(--surface-3);
  color: var(--accent-secondary);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.nav-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding: 0 10px 6px 10px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
  position: relative;
  text-align: left;
}
.nav-item:hover {
  background: var(--surface-hover);
  color: var(--text);
}
.nav-item.active {
  background: var(--surface-2);
  color: var(--text);
  font-weight: 600;
  border-left: 3px solid var(--accent-primary);
  border-top-left-radius: 2px;
  border-bottom-left-radius: 2px;
}
.nav-item svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  stroke-width: 2;
}
.nav-badge {
  margin-left: auto;
  font-size: 11px;
  background: var(--surface-3);
  padding: 2px 7px;
  border-radius: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.nav-item.active .nav-badge {
  background: var(--accent-primary);
  color: white;
}
.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-1);
}
.sidebar-mini-progress {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
}
.progress-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.progress-meta-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-subtle);
}
.progress-meta-pct {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-secondary);
}
.progress-bar-bg {
  height: 6px;
  background: var(--surface-3);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  border-radius: 99px;
  transition: width 0.3s ease;
}
.storage-tag-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-subtle);
}
.status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--success);
  border-radius: 50%;
  margin-right: 4px;
  box-shadow: 0 0 6px var(--success);
}

/* Main Content Area */
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Topbar */
header.topbar {
  height: var(--topbar-h);
  background: rgba(15, 20, 32, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 30;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.mobile-nav-toggle {
  display: none;
  padding: 8px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
}
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
.breadcrumb-separator {
  color: var(--text-subtle);
  font-size: 11px;
}
.breadcrumb-active {
  color: var(--text);
  font-weight: 600;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Study Timer Pill */
.timer-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 99px;
  font-size: 12px;
}
.timer-pill.running {
  border-color: var(--accent-primary);
  background: rgba(139, 92, 246, 0.1);
}
.timer-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-subtle);
}
.timer-pill.running .timer-indicator {
  background: var(--accent-primary);
  box-shadow: 0 0 8px var(--accent-primary);
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}
.timer-digits {
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text);
}
.timer-btn {
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.timer-btn:hover {
  background: var(--surface-3);
  color: var(--text);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn:hover {
  background: var(--surface-hover);
  border-color: var(--border-light);
}
.btn-primary {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: white;
  box-shadow: 0 2px 8px rgba(139, 92, 246, 0.25);
}
.btn-primary:hover {
  background: #7c4ee4;
  border-color: #7c4ee4;
}
.btn-secondary {
  background: var(--surface-3);
  border-color: var(--border);
}
.btn-danger {
  background: var(--danger-bg);
  border-color: rgba(239, 68, 68, 0.4);
  color: #fca5a5;
}
.btn-danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: var(--danger);
  color: white;
}
.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}
.btn-icon {
  padding: 7px;
  border-radius: var(--radius-sm);
}

/* Global Search Trigger */
.search-trigger-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 12px;
  min-width: 200px;
  transition: border-color 0.15s ease;
}
.search-trigger-btn:hover {
  border-color: var(--border-light);
  color: var(--text);
}
.search-kbd {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 4px;
  color: var(--text-subtle);
}

/* Page Body */
main.main-content {
  padding: 32px 36px 64px;
  max-width: 1540px;
  width: 100%;
  margin: 0 auto;
}

/* View Header */
.view-header {
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}
.view-pretitle {
  color: var(--accent-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
}
.view-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: var(--text);
  line-height: 1.2;
}
.view-description {
  color: var(--text-muted);
  font-size: 14px;
  max-width: 820px;
  margin-top: 6px;
}
.view-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* Cards & Surfaces */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
}
.card:hover {
  border-color: var(--border-light);
}

/* KPI Stat Cards Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
}
.stat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.stat-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-subtle);
}
.stat-icon {
  color: var(--text-subtle);
  display: flex;
}
.stat-value {
  font-size: 30px;
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 6px;
}
.stat-subtext {
  font-size: 12px;
  color: var(--text-muted);
}

/* Visual Roadmap Section */
.roadmap-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 32px;
}
.roadmap-phase-card {
  background: var(--surface-1);
  border: 1fr solid var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all 0.2s ease;
}
.roadmap-phase-header {
  padding: 16px 20px;
  background: var(--surface-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.roadmap-phase-header:hover {
  background: var(--surface-hover);
}
.phase-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.phase-status-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.phase-status-badge.completed {
  background: var(--success-bg);
  color: var(--success);
  border-color: rgba(34, 197, 94, 0.3);
}
.phase-status-badge.in-progress {
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent-secondary);
  border-color: rgba(56, 189, 248, 0.3);
}
.phase-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.phase-meta-info {
  font-size: 12px;
  color: var(--text-muted);
}
.phase-right-meta {
  display: flex;
  align-items: center;
  gap: 16px;
}
.phase-pct-text {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-secondary);
}
.phase-chevron {
  transition: transform 0.2s ease;
  color: var(--text-subtle);
}
.roadmap-phase-card.collapsed .phase-chevron {
  transform: rotate(-90deg);
}
.roadmap-phase-body {
  padding: 16px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.roadmap-phase-card.collapsed .roadmap-phase-body {
  display: none;
}

/* Module Card */
.module-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  transition: all 0.15s ease;
  cursor: pointer;
}
.module-card:hover {
  border-color: var(--accent-primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.module-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.module-id-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-secondary);
  background: rgba(56, 189, 248, 0.1);
  padding: 2px 7px;
  border-radius: 4px;
}
.module-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}
.module-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.45;
  margin-bottom: 14px;
  flex: 1;
}
.module-card-bottom {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.module-progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-subtle);
  font-family: var(--font-mono);
}

/* Two-column layout */
.two-col-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 28px;
}

/* Toolbars & Filters */
.toolbar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.input-search {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  color: var(--text);
  font-size: 13px;
  flex: 1;
  min-width: 240px;
  transition: border-color 0.15s ease;
}
.input-search:focus {
  outline: none;
  border-color: var(--accent-primary);
}
.select-filter {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  min-width: 160px;
}
.select-filter:focus {
  outline: none;
  border-color: var(--accent-primary);
}

/* Tables & Lists */
.data-table-container {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}
.data-table th {
  background: var(--surface-2);
  padding: 12px 16px;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-subtle);
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.data-table tr:last-child td {
  border-bottom: none;
}
.data-table tr:hover td {
  background: var(--surface-hover);
}

/* Checklists & Interactive Task Items */
.checklist-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  transition: all 0.15s ease;
  cursor: pointer;
  user-select: none;
}
.check-item:hover {
  border-color: var(--border-light);
  background: var(--surface-hover);
}
.check-item.done {
  border-color: rgba(34, 197, 94, 0.25);
  background: rgba(34, 197, 94, 0.04);
}
.check-item input[type="checkbox"] {
  width: 17px;
  height: 17px;
  margin-top: 2px;
  accent-color: var(--accent-primary);
  cursor: pointer;
  flex-shrink: 0;
}
.check-item-text {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
  flex: 1;
}
.check-item.done .check-item-text {
  color: var(--text-muted);
  text-decoration: line-through;
}

/* Module Detail View Components */
.module-detail-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 28px;
  align-items: flex-start;
}
.module-main-col {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.module-side-col {
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 84px;
}
.section-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
}
.section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title svg {
  color: var(--accent-primary);
}
.prose {
  font-size: 14px;
  line-height: 1.65;
  color: #cbd5e1;
}
.prose p { margin-bottom: 12px; }
.prose ul, .prose ol {
  margin: 10px 0 16px 20px;
}
.prose li {
  margin-bottom: 6px;
}

/* Code & Cheatsheet Blocks */
.code-block {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.code-block code {
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
.copy-btn {
  color: var(--text-subtle);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
}
.copy-btn:hover {
  background: var(--surface-3);
  color: var(--text);
}

/* Badges & Tags */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--surface-3);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.badge-primary { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border-color: rgba(139, 92, 246, 0.3); }
.badge-secondary { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
.badge-success { background: var(--success-bg); color: var(--success); border-color: rgba(34, 197, 94, 0.3); }
.badge-warning { background: var(--warning-bg); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
.badge-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

/* Activity Log Timeline */
.timeline {
  display: flex;
  flex-direction: column;
  position: relative;
  padding-left: 20px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--border);
}
.timeline-item {
  position: relative;
  padding-bottom: 20px;
}
.timeline-item:last-child {
  padding-bottom: 0;
}
.timeline-dot {
  position: absolute;
  left: -20px;
  top: 4px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-1);
  border: 2px solid var(--accent-primary);
}
.timeline-content {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
}
.timeline-meta {
  font-size: 11px;
  color: var(--text-subtle);
  font-family: var(--font-mono);
  margin-bottom: 4px;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 11, 18, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s ease;
}
.modal-backdrop.open {
  opacity: 1;
  visibility: visible;
}
.modal-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  transform: translateY(12px) scale(0.98);
  transition: all 0.2s ease;
}
.modal-backdrop.open .modal-box {
  transform: translateY(0) scale(1);
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.modal-body {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* Form Controls */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.form-input, .form-textarea, .form-select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  transition: border-color 0.15s ease;
  width: 100%;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--accent-primary);
}
.form-textarea {
  min-height: 100px;
  resize: vertical;
}

/* Command Palette (Cmd+K) */
.cmd-modal-box {
  max-width: 600px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-1);
}
.cmd-input-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.cmd-input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 16px;
  width: 100%;
}
.cmd-results-list {
  max-height: 380px;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.cmd-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  transition: all 0.1s ease;
}
.cmd-item:hover, .cmd-item.selected {
  background: var(--surface-hover);
  color: var(--text);
}
.cmd-item-type {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  background: var(--surface-3);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--text-subtle);
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.toast {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  pointer-events: auto;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.toast.show {
  transform: translateY(0);
  opacity: 1;
}
.toast.success { border-color: rgba(34, 197, 94, 0.4); }
.toast.success svg { color: var(--success); }
.toast.error { border-color: rgba(239, 68, 68, 0.4); }
.toast.error svg { color: var(--danger); }

/* Responsive Media Queries */
@media (max-width: 1080px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col-grid { grid-template-columns: 1fr; }
  .module-detail-layout { grid-template-columns: 1fr; }
  .module-side-col { position: static; }
}
@media (max-width: 860px) {
  aside.sidebar {
    position: fixed;
    left: -100%;
    box-shadow: 20px 0 40px rgba(0,0,0,0.5);
  }
  aside.sidebar.mobile-open {
    left: 0;
  }
  .mobile-nav-toggle {
    display: flex;
  }
  main.main-content {
    padding: 20px 16px 40px;
  }
  header.topbar {
    padding: 0 16px;
  }
  .search-trigger-btn { min-width: auto; }
}
@media (max-width: 600px) {
  .stats-grid { grid-template-columns: 1fr; }
  .view-header { flex-direction: column; align-items: stretch; }
  .toolbar-row { flex-direction: column; align-items: stretch; }
  .select-filter { width: 100%; }
}
</style>

istakes, and security risks"}],"subtopics":[{"title":"PowerShell Object Pipeline & CIM Queries","detail":"Pipeline passing .NET objects rather than strings, WMI repository architecture, CIM sessions, Script Block execution."},{"title":"PowerShell Security Controls & Telemetry","detail":"Execution Policy (and why it is not a boundary), Constrained Language Mode, Script Block Logging (Event ID 4104), Transcription."},{"title":"POSIX Bash Scripting & Stream Processing","detail":"Subshells, file descriptors (stdin/stdout/stderr), parameter expansion, sed/awk text filtering, cron and systemd timer syntax."}],"knowledgeAssessment":["Why is PowerShell's object pipeline fundamentally more reliable for automation than Bash text streams?","How does PowerShell Script Block Logging defeat obfuscation?","What is the difference between $() command substitution and backticks in Bash?","How do you handle error trapping and non-terminating errors in PowerShell ($ErrorActionPreference)?"]},{"id":"mod-07","num":"07","title":"C, C++ and Assembly","whyMatters":"Understand memory, compiled code and low-level behaviour needed for reverse engineering and vulnerability research.","topicsStr":"C types, pointers, arrays, strings, structs, unions, memory allocation, stack/heap, compilation and linking; C++ classes, references, RAII, smart pointers, templates and STL; binary/hex, registers, x86/x64 instructions, addressing, stack frames, calling conventions, control flow, debugging and disassembly.","booksStr":"Computer Systems: A Programmer's Perspective: information representation, machine-level programming, processor architecture, linking, exceptional control flow, virtual memory, system I/O and networking. OST2 assembly courses.","coursesStr":"Hackers-Arise: x86 Assembler Language; Exploit Development Part I and II only after C and assembly foundations. OST2: x86-64 and low-level programming. pwn.college for structured practice.","practicalStr":"Compile benign C programs, inspect assembly in Compiler Explorer, debug with GDB and map stack/heap layouts in toy programs.","deliverable":"Annotated source-to-assembly examples and a debugger walkthrough report.","urls":[{"name":"CS:APP","url":"https://csapp.cs.cmu.edu/"},{"name":"OST2","url":"https://ost2.fyi/"},{"name":"pwn.college","url":"https://pwn.college/"}],"tools":["gcc / clang","gdb (gef/pwndbg)","Compiler Explorer","objdump","strace","valgrind"],"commands":[{"cmd":"gcc -g -O0 -fno-stack-protector -z execstack program.c -o program","desc":"Compile toy binary with debugging symbols and disabled protections for analysis"},{"cmd":"objdump -d -M intel ./program | grep -A 20 '<main>:'","desc":"Disassemble main function in Intel syntax"},{"cmd":"gdb -q ./program -ex 'b *main' -ex 'r' -ex 'info registers'","desc":"Launch GDB, set breakpoint at main, run and display register state"},{"cmd":"valgrind --leak-check=full ./program","desc":"Analyze heap memory leaks and buffer over-reads"}],"subtopics":[{"title":"Pointers, Memory Allocation & Memory Model","detail":"Pointer arithmetic, double pointers, stack allocation vs heap (malloc/free), memory leaks, dangling pointers, struct packing."},{"title":"x86-64 Assembly & Calling Conventions","detail":"System V AMD64 ABI (RDI, RSI, RDX, RCX, R8, R9) vs Microsoft x64 (RCX, RDX, R8, R9, Shadow Space), stack alignment, prologue/epilogue."},{"title":"Compilation, Linking & Debugging","detail":"Pre-processor, compilation to assembly, object file creation, dynamic vs static linking, symbol tables, GDB memory examination."}],"knowledgeAssessment":["Explain what happens to RSP and RBP when a CALL instruction is executed.","What is the difference between Microsoft x64 and System V AMD64 calling conventions?","Why is an out-of-bounds pointer write to the stack dangerous for control flow?","How does RAII in C++ prevent resource leaks compared to manual C memory management?"]}]},{"name":"Phase 2 · APT research and Cyber Threat Intelligence","period":"Months 7–10","goal":"Learn to investigate threat actors, campaigns, infrastructure and reported behaviour using evidence and confidence levels.","modules":[{"id":"mod-08","num":"08","title":"APT Fundamentals and MITRE ATT&CK","whyMatters":"Understand adversary motivations and translate public reporting into structured intelligence.","topicsStr":"APT vs cybercrime; state-sponsored and financially motivated threats; campaigns vs intrusions; actor aliases; malware families; TTPs; attribution limits; false flags; intelligence lifecycle; strategic/operational/tactical/technical CTI; source reliability; confidence; ATT&CK tactics, techniques, sub-techniques, groups, software, campaigns, mitigations and detection strategies; Kill Chain; Diamond Model; Pyramid of Pain; STIX/TAXII.","booksStr":"MITRE ATT&CK: read Enterprise matrix, tactics, techniques, groups, software, campaigns, mitigations and detection strategies. Study analytic confidence and source quality. CISA advisories and public vendor reports for evidence.","coursesStr":"Hackers-Arise: Cyber Threat Intelligence for Hackers; MITRE ATT&CK Framework for Security Analyst. Supplement with MITRE CTI training and HTB/THM relevant CTI rooms.","practicalStr":"Map public campaign reporting to ATT&CK; record source URL, quoted behaviour, technique rationale and confidence; build an ATT&CK Navigator layer.","deliverable":"One actor profile, one campaign timeline, ATT&CK layer and evidence register.","urls":[{"name":"MITRE ATT&CK","url":"https://attack.mitre.org/"},{"name":"ATT&CK Navigator","url":"https://mitre-attack.github.io/attack-navigator/"},{"name":"CISA Advisories","url":"https://www.cisa.gov/news-events/cybersecurity-advisories"},{"name":"MITRE Intelligence Analysis","url":"https://www.mitre.org/our-impact/intelligence-analysis"}],"tools":["ATT&CK Navigator","OpenCTI","MISP","yeti","Spiderfoot"],"commands":[{"cmd":"curl -s https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json | jq '.objects[0]'","desc": ner, Open Source Intelligence, Remaining Anonymous. HTB Academy: Footprinting and Reconnaissance. Tools: Amass, Subfinder, Shodan, Censys, Maltego, SpiderFoot and crt.sh.","practicalStr":"Conduct passive analysis of a publicly documented campaign's domains and certificates; preserve evidence and confidence; avoid unauthorised scanning.","deliverable":"Infrastructure relationship graph and reproducible OSINT report.","urls":[{"name":"Shodan","url":"https://www.shodan.io/"},{"name":"Censys","url":"https://search.censys.io/"},{"name":"Certificate Transparency (crt.sh)","url":"https://crt.sh/"},{"name":"ProjectDiscovery","url":"https://docs.projectdiscovery.io/"},{"name":"Maltego","url":"https://www.maltego.com/"}],"tools":["Shodan","Censys","Subfinder","Amass","crt.sh","Maltego","dnsx"],"commands":[{"cmd":"subfinder -d example.com -silent | dnsx -silent -a -resp","desc":"Enumerate subdomains passively and resolve to active A records"},{"cmd":"curl -s 'https://crt.sh/?q=%.example.com&output=json' | jq -r '.[].name_value' | sort -u","desc":"Extract all certificates from Certificate Transparency logs"},{"cmd":"shodan search 'ssl.cert.subject.CN:\"target.com\" 200' --fields ip_str,port","desc":"Discover exposed IP addresses hosting SSL certificates for target"},{"cmd":"whois -h whois.radb.net -- '-i origin AS13335'","desc":"Enumerate all IP prefixes announced by an Autonomous System Number"}],"subtopics":[{"title":"Passive DNS & Infrastructure Pivoting","detail":"Forward DNS, reverse DNS, historic pDNS records, tracking domain name server changes across campaigns, identifying shared bulletproof hosting."},{"title":"Certificate Transparency & JARM Fingerprinting","detail":"Parsing CT logs for pre-issuance staging, JARM active TLS server fingerprinting to detect Cobalt Strike, Mythic, and custom C2 servers."},{"title":"Internet-Wide Scanners & OSINT Ethics","detail":"Querying Shodan, Censys, and BinaryEdge without touching target infrastructure directly; maintaining passive OPSEC."}],"knowledgeAssessment":["How can Certificate Transparency logs reveal adversary staging infrastructure before a phishing campaign launches?","Explain how JARM fingerprints are generated and why identical C2 configurations yield identical hashes.","What is the difference between active reconnaissance and passive threat infrastructure pivoting?","How does an analyst pivot from a single WHOIS registrant email to an entire infrastructure fleet?"]},{"id":"mod-10","num":"10","title":"APT Groups and Campaign Research","whyMatters":"Develop a repeatable method for researching named actors and reconstructing campaigns.","topicsStr":"Research aliases; attribution caveats; motivation; target sectors; victimology; timelines; initial access; execution; persistence; credential access; discovery; lateral movement; C2; malware; infrastructure; detections; mitigations; competing hypotheses and intelligence gaps.","booksStr":"Read MITRE group pages and primary public reporting from CISA, Microsoft, Google Threat Intelligence, Mandiant, ESET and Unit 42. Compare multiple reports rather than trusting a single attribution.","coursesStr":"Hackers-Arise: CTI, MITRE ATT&CK, Phishing Analysis and Investigating a Cyber Attack. This is a research-led module, so primary reports matter more than video courses.","practicalStr":"Create dossiers for APT28, APT29, Lazarus, APT41, Sandworm and Turla. Distinguish observed facts from vendor assessments.","deliverable":"Six evidence-backed actor/campaign dossiers and a comparative analysis.","urls":[{"name":"ATT&CK Groups","url":"https://attack.mitre.org/groups/"},{"name":"Google Threat Intelligence","url":"https://cloud.google.com/blog/topics/threat-intelligence"},{"name":"Mandiant Research","url":"https://www.mandiant.com/resources"},{"name":"Microsoft Security Blog","url":"https://www.microsoft.com/en-us/security/blog/"}],"tools":["MISP","OpenCTI","ATT&CK Navigator","Maltego","Obsidian"],"commands":[{"cmd":"opencti-cli threat-actors list --search 'APT29'","desc":"Query OpenCTI instance for threat actor alias history and attributed malware"},{"cmd":"cat campaign_report.pdf | pdftotext - - | grep -iE 'cve-[0-9]{4}-[0-9]{4,}' | sort -u","desc":"Extract exploited CVE identifiers from research whitepaper"}],"subtopics":[{"title":"Major APT Profiles & Operational TTPs","detail":"APT28 (Fancy Bear / GRU), APT29 (Cozy Bear / SVR), Lazarus Group (DPRK RGB), APT41 (Double Dragon / MSS), Sandworm (GRU Unit 74455)."},{"title":"Campaign Reconstruction Methodology","detail":"Timeline analysis, identifying initial access vector (spearphishing vs zero-day vs supply chain), tracking persistence mechanisms."},{"title":"Intelligence Gaps & Analytical Traps","detail":"Dealing with missing evidence, distinguishing shared malware builder code from state actor cooperation, false flags in attribution."}],"knowledgeAssessment":["What operational security differences distinguish APT29 from APT28?","How did Sandworm's operations differ between BlackEnergy, NotPetya, and Industroyer?","Why is actor clustering often named differently across commercial security vendors?","What evidence is required to establish high confidence in state-sponsored attribution?"]}]},{"name":"Phase 3 · Initial access, identity and enterprise compromise research","period":"Months 11–14","goal":"Understand identity systems and documented initial-access behaviours from both attacker-research and defensive perspectives.","modules":[{"id":"mod-11","num":"11","title":"Social Engineering, Phishing and Identity Security","whyMatters":"Understand how human and identity attack surfaces are abused and how organisations detect and prevent that abuse.","topicsStr":"Phishing, spear phishing, BEC, vishing, smishing, QR phishing, email headers, SMTP, SPF, DKIM, DMARC, attachment and URL analysis, OAuth consent risks, MFA fatigue, AiTM concepts, session tokens, FIDO2, passkeys, WebAuthn, SSO, OAuth, OIDC, SAML, Conditional Access and identity logs.","booksStr":"NIST Digital Identity Guidelines; Microsoft Entra identity documentation; MITRE Initial Access; CISA phishing-resistant MFA guidance; OWASP authentication and session guidance.","coursesStr":"Hackers-Arise: Phishing Analysis for Security Analyst; The Science and Art of Social Engineering; The Art of Social Engineering in the Era of AI. Use approved simulation platforms and synthetic accounts.","practicalStr":"Analyse synthetic phishing messages and headers; review identity sign-in logs; compare password-based MFA with phishing-resistant MFA. Do not deploy credential/session harvesting against real services or people.","deliverable":"Email investigation report, identity threat model and phishing-resistant MFA recommendation.","urls":[{"name":"NIST Digital Identity","url":"https://pages.nist.gov/800-63-4/"},{"name":"Microsoft Entra","url":"https://learn.microsoft.com/en-us/entra/identity/"},{"name":"ATT&CK Initial Access","url":"https://attack.mitre.org/tactics/TA0001/"},{"name":"OWASP WSTG","url":"https://owasp.org/www-project-web-security-testing-guide/"}],"tools":["Emldump","Mailheader analyzer","Sublime Security","Entra ID Portal","YubiKey Manager"],"commands":[{"cmd":"dig TXT example.com +short | grep v=spf1","desc":"Inspect DNS SPF record policy flags"},{"cmd":"opendkim-testkey -d example.com -s default -k key.private","desc":"Verify DKIM DNS selector public key alignment"},{"cmd":"python3 -m eml_analyzer message.eml","desc":"Extract routing hops, Received headers, and attachments from raw EML"}],"subtopics":[{"title":"Email Security Architecture (SPF, DKIM, DMARC)","detail":"SPF alignment, DKIM cryptographic message signing, DMARC enforcement policies (p=reject, p=quarantine), bounce attacks."},{"title":"Adversary-in-the-Middle (AiTM) & Session Theft","detail":"Reverse proxy credential interceptors (Evilginx concepts), stealing session cookies and bearer tokens to bypass traditional push/SMS MFA."},{"title":"Phishing-Resistant MFA & Modern Identity","detail":"FIDO2 / on; PowerShell telemetry; WMI; services; scheduled tasks; registry autoruns; Linux systemd; SSH artefacts; privilege boundaries; remote administration; SMB/RDP/WinRM telemetry; C2 architecture; beaconing; DNS/HTTP indicators; staging, collection and exfiltration indicators.","booksStr":"MITRE ATT&CK technique pages and detection strategies; Sysmon documentation; Microsoft Sysinternals; Atomic Red Team test documentation; CALDERA documentation.","coursesStr":"Hackers-Arise: Red Team Operator Part I, Active Directory, PowerShell and Advanced Linux. Use course material to understand concepts, not as a licence to operate outside a lab.","practicalStr":"Run selected safe Atomic Red Team tests on disposable lab endpoints; collect Sysmon and network telemetry; validate detections and document false positives.","deliverable":"ATT&CK behaviour-to-telemetry matrix, detection hypotheses and test report.","urls":[{"name":"Sysinternals","url":"https://learn.microsoft.com/en-us/sysinternals/"},{"name":"Sysmon Docs","url":"https://learn.microsoft.com/en-us/sysmon/"},{"name":"Atomic Red Team","url":"https://github.com/redcanaryco/atomic-red-team"},{"name":"MITRE CALDERA","url":"https://caldera.mitre.org/"}],"tools":["Atomic Red Team","CALDERA","Sysmon","Velociraptor","Wireshark","Zeek"],"commands":[{"cmd":"Invoke-AtomicTest T1059.001 -ShowDetails","desc":"Display execution steps for PowerShell ATT&CK test"},{"cmd":"Get-ScheduledTask | Where-Object {$_.State -ne 'Disabled' -and $_.Author -notlike '*Microsoft*'} | Select TaskName, TaskPath","desc":"Enumerate non-standard persistence scheduled tasks"},{"cmd":"Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer","desc":"Enumerate persistent WMI Event Consumers"},{"cmd":"tshark -r c2.pcap -qz io,stat,10,\"COUNT(frame.time_delta)frame.time_delta\"","desc":"Analyze network traffic packet timing intervals to identify periodic beaconing"}],"subtopics":[{"title":"Execution Vectors & Living off the Land (LotL)","detail":" rings/imports; inspect PE headers; write basic YARA rules; compare static findings with sandbox reports.","deliverable":"Malware analysis report, IOC list and tested YARA rule. Never execute unknown samples on a personal host.","urls":[{"name":"REMnux Docs","url":"https://docs.remnux.org/"},{"name":"FLARE-VM","url":"https://github.com/mandiant/flare-vm"},{"name":"Ghidra","url":"https://ghidra-sre.org/"},{"name":"YARA Documentation","url":"https://yara.readthedocs.io/"},{"name":"Mandiant capa","url":"https://github.com/mandiant/capa"}],"tools":["PE-bear","capa","FLOSS","YARA","Process Hacker","FakeNet-NG","RegShot"],"commands":[{"cmd":"capa -vv sample.bin","desc":"Identify capabilities, ATT&CK mapping, and MBC rules in binary"},{"cmd":"floss --no-static-strings sample.exe","desc":"Extract decoded and stack-based obfuscated strings from executable"},{"cmd":"yara -s rule.yar sample.exe","desc":"Scan binary with custom YARA rule and print matching string offsets"},{"cmd":"sha256sum sample.exe && ssdeep sample.exe","desc":"Calculate cryptographic SHA-256 and contextual fuzzy hash (ssdeep)"}],"subtopics":[{"title":"Static Analysis & PE Header Forensics","detail":"Dos Stub, PE Signature, File Header, Optional Header, Subsystem, Section Table (.text, .rdata, .data), Import Address Table analysis, entropy analysis."},{"title":"Dynamic Analysis & Behavioral Baselining","detail":"Host baselining with RegShot, network simulation with FakeNet-NG / inetsim, monitoring process injection and registry hooks in sandbox."},{"title":"Signaturing with YARA & IOC Extraction","detail":"Writing robust byte-pattern and string rules, wide vs ascii strings, condition logic, avoiding brittle hash indicators."}],"knowledgeAssessment":["What does high section entropy (e.g. > 7.2) indicate about a PE section?","Why is ssdeep (fuzzy hashing) more useful than SHA-256 for tracking malware variant campaigns?","How does capa determine that an executable contains process hollowing capability?","What indicators distinguish a packed executable from a standard compiled binary?"]},{"id":"mod-15","num":"15","title":"Reverse Engineering","whyMatters":"Understand how compiled programs work so you can reconstruct logic, identify suspicious functions and explain observed behaviour.","topicsStr":"PE/ELF/Mach-O overview; assembly; registers; stack and heap; calling conventions; function prologues/epilogues; control flow; CFG; disassembly; decompilation; debugging; breakpoints; cross-references; API calls; dynamic linking; symbol analysis; cryptographic routine recognition; obfuscation and packing concepts.","booksStr":"OST2 x86-64 and low-level courses; CS:APP machine-level programming and linking; Ghidra documentation; GDB documentation.","coursesStr":"Hackers-Arise: x86 Assembler Language, Reverse Engineering Malware I–III, Exploit Development I–II after prerequisites. Use OST2 as the low-level teaching backbone.","practicalStr":"Compile harmless programs; disassemble; debug; map functions and control flow; document how a benign program processes input.","deliverable":"Reverse-engineering notebook with annotated disassembly and reconstructed program logic.","urls":[{"name":"OST2","url":"https://ost2.fyi/"},{"name":"Ghidra","url":"https://ghidra-sre.org/"},{"name":"GDB Documentation","url":"https://sourceware.org/gdb/documentation/"},{"name":"CS:APP","url":"https://csapp.cs.cmu.edu/"}],"tools":["Ghidra","IDA Free","x64dbg","GDB","Cutter","Binary Ninja Free"],"commands":[{"cmd":"ghidraHeadless /tmp/ghidra_proj myProject -import sample.bin -postScript DecompileAll.java","desc":"Run headless automated Ghidra decompilation"},{"cmd":"x64dbg sample.exe","desc":"Attach ring-3 Windows debugger with memory breakpoints and API call tracing"}],"subtopics":[{"title":"Control Flow Graphs & Decompilation Logic","detail":"Basic blocks, conditional branches (JZ, JNZ, JAE), loop reconstruction, switch tables, function cross-references (XREFs)."},{"title":"Anti-Analysis & Anti-Debugging Tricks","detail":"IsDebuggerPresent, PEB BeingDebugged flag, NtQueryInformationProcess, RDTSC timing checks, software vs hardware breakpoints (DR0-DR3)."},{"title":"Cryptographic Routine Recognition","detail":"Identifying standard S-boxes (AES), initialization vectors, XOR loops, RC4 key scheduling algorithms (KSA) and PRGA in disassembly."}],"knowledgeAssessment":["Explain how a debugger handles a software breakpoint (INT 3 / 0xCC) versus a hardware breakpoint.","How do you locate the True Condition path vs False Condition path in a disassembled branch?","What is the PEB (Process Environment Block) and how do malware authors query it to detect debuggers?","How can you differentiate a compiler-generated switch statement from nested IF statements in Ghidra?"]},{"id":"mod-16","num":"16","title":"Malware Intelligence and Threat Hunting","whyMatters":"Convert malware observations into campaign intelligence and testable detections.","topicsStr":"IOC extraction; family clustering; campaign correlation; YARA; Sigma; detection hypotheses; endpoint and network telemetry; false-positive testing; threat intelligence enrichment; evidence confidence; ATT&CK mapping; detection validation.","booksStr":"YARA documentation; SigmaHQ rules; MISP and OpenCTI docs; Malware Traffic Analysis; vendor reports and CyberDefenders challenges.","coursesStr":"Hackers-Arise: CTI, Memory Forensics, Phishing Analysis, Investigating a Cyber Attack and Snort. CyberDefenders for investigation practice.","practicalStr":"Analyse safe sample datasets; enrich indicators; build and test rules; correlate host and network evidence; explain limitations.","deliverable":"Malware research dossier, IOC package, detection rules and validation report.","urls":[{"name":"Sigma Rules","url":"https://sigmahq.io/"},{"name":"MISP Project","url":"https://docs.misp-project.org/"},{"name":"OpenCTI","url":"https://docs.opencti.io/"},{"name":"Malware Traffic Analysis","url":"https://www.malware-traffic-analysis.net/"}],"tools":[ g_bytes | sort -nrk 6 | head -10","desc":"Identify top outbound bandwidth connections from Zeek connection log"},{"cmd":"tshark -r capture.pcap -Y 'http.request.method == \"POST\"' -T fields -e ip.src -e ip.dst -e http.host -e http.request.uri","desc":"Extract all HTTP POST request targets and URIs"},{"cmd":"suricata -r attack.pcap -l /var/log/suricata/ -k none","desc":"Run Suricata IDS engine against PCAP and generate eve.json alerts"}],"subtopics":[{"title":"Protocol Carving & Stream Reassembly","detail":"Reconstructing transferred files, extracting MIME attachments, reassembling fragmented TCP streams, carving HTTP transfers."},{"title":"Command and Control Network Signatures","detail":"Detecting periodic beacon intervals, calculating byte-count variance, detecting DNS tunneling queries via high entropy and query volume."},{"title":"Network Telemetry at Enterprise Scale","detail":"Combining NetFlow / IPFIX flow data with Zeek transaction logs and Suricata signature alerts to reconstruct adversary exfiltration."}],"knowledgeAssessment":["How do you calculate beaconing interval jitter from network flow logs?","What characteristics in DNS query logs differentiate legitimate CDN queries from DNS tunneling exfiltration?","Explain how JA3/JA3S TLS fingerprinting assists in identifying malicious clients even when traffic is encrypted.","What is the difference between full packet capture (PCAP) and session-based network metadata?"]},{"id":"mod-20","num":"20","title":"Incident Response and Threat Hunting","whyMatters":"Move from isolated artefacts to complete incident handling and hypothesis-driven investigations.","topicsStr":"Preparation; detection; analysis; containment; eradication; recovery; post-incident review; incident severity; scoping; root cause; evidence preservation; threat-hunting hypotheses; IOC/TTP/behaviour hunting; endpoint, network, identity and cloud telemetry; playbooks; lessons learned.","booksStr":"NIST incident response guidance and CSF; CISA incid ding"},{"cmd":"DeviceProcessEvents | where FileName =~ \"powershell.exe\" and ProcessCommandLine has_any (\"-enc\", \"-encodedcommand\", \"IEX\", \"DownloadString\")","desc":"Microsoft Defender KQL: Detect obfuscated PowerShell execution"}],"subtopics":[{"title":"Detection-as-Code Pipeline","detail":"Managing rules in Git repositories, automated CI testing against recorded event data, automated translation from Sigma to SPL/KQL."},{"title":"Log Telemetry Pipelines & Parsing","detail":"Logstash, Fluentbit, Vector, normalizing disparate syslog and Event Log schemas into Open Cybersecurity Schema Framework (OCSF) or ECS."},{"title":"Purple Teaming & Metric Tuning","detail":"Emulating adversary atomic actions, verifying detection alerting, calculating Mean Time to Detect (MTTD), reducing false positive noise."}],"knowledgeAssessment":["Why is detecting behaviors (e.g., suspicious parent-child process pairs) more durable than detecting specific file names or command-line flags?","How does the OCSF (Open Cybersecurity Schema Framework) address log normalization across cloud and on-premise vendors?","What is alert fatigue and what testing standards prevent it in production SOC environments?","Explain how detection engineers test rules against benign enterprise baselines prior to deployment."]}]},{"name":"Phase 6 · Professional penetration testing","period":"Months 24–28","goal":"Develop a complete, repeatable, authorised security assessment methodology.","modules":[{"id":"mod-22","num":"22","title":"Professional Pentesting Methodology","whyMatters":"Learn how to scope, execute, evidence and report an authorised security assessment.","topicsStr":"Engagement planning; authorisation; rules of engagement; scope; asset inventory; reconnaissance; enumeration; vulnerability validation; risk rating; evidence; remediation; retesting; QA; executive and technical reports.","booksStr":"NIST SP 800-115; OWASP Testing Guide; HTB CPTS path and official exam objectives; OffSec PEN-200 syl Str":"HTB Active Directory Penetration Tester path; Microsoft AD DS, ADCS and Entra documentation; CRTP/CRTE syllabi for learning objectives.","coursesStr":"Hackers-Arise: Active Directory for Hackers and PowerShell for Hackers. HTB AD path is the primary practical track.","practicalStr":"Build an isolated multi-machine lab; assess identity configuration and permissions; validate findings safely; implement and retest remediation.","deliverable":"Enterprise AD assessment and identity-hardening report.","urls":[{"name":"HTB AD Path","url":"https://academy.hackthebox.com/path/preview/active-directory-penetration-tester"},{"name":"Microsoft Entra","url":"https://learn.microsoft.com/en-us/entra/identity/"},{"name":"AD CS Documentation","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-cs/"}],"tools":["Certipy","BloodHound","Rubeus","Mimikatz","Powerview","PKINITtools"],"commands":[{"cmd":"certipy find -u user@corp.local -p 'Pass123' -dc-ip 10.10.10.1 -vulnerable","desc":"Audit Active Directory Certificate Services (ADCS) for vulnerable certificate templates (ESC1-ESC13)"},{"cmd":"certipy req -u user@corp.local -p 'Pass123' -ca CORP-CA -template ESC1Template -upn administrator@corp.local","desc":"Request certificate impersonating Domain Administrator via misconfigured SAN template"},{"cmd":"Rubeus.exe asktgt /user:administrator /certificate:admin.pfx /password:certpass /ptt","desc":"Request Kerberos TGT using certificate authentication (PKINIT) and inject into current session"}],"subtopics":[{"title":"ADCS Abuse Vectors (Certified Pre-Owned)","detail":"ESC1 (client auth + SAN modification), ESC2 (any-purpose EKU), ESC3 (certificate request agent), ESC4 (template DACL overwrite), ESC8 (NTLM relay to HTTP enrollment)."},{"title":"Kerberos Delegation & Cross-Forest Trusts","detail":"Constrained delegation abuse (S4U2self / S4U2proxy), Resource-Based Constrained Delegation (RBCD), SID Filtering and SID History abuse across trusts."},{"title":"Hybrid Identity & Cloud Pivoting","detail":"Password Hash Sync (PHS) vs Pass-Through Authentication (PTA), Azure AD Connect sync account abuse (MSOL_*), Primary Refresh Token (PRT) theft."}],"knowledgeAssessment":["Explain the misconfiguration that creates an ADCS ESC1 vulnerability and how it allows full forest takeover.","How does Resource-Based Constrained Delegation (RBCD) allow compromise of a target computer account?","What is SID History filtering and why does it prevent privilege escalation across external forest trusts?","How does an attacker with local administrator rights on an Azure AD Connect server extract synchronization credentials?"]},{"id":"mod-28","num":"28","title":"Cloud Security: AWS, Azure and GCP","whyMatters":"Understand cloud control planes, identity, networks, logging and secure configuration before cloud assessments.","topicsStr":"AWS IAM, STS, Organizations, VPC, EC2, S3, CloudTrail, GuardDuty, Config, KMS, Secrets Manager and EKS; Azure Entra, RBAC, managed identities, VNet, Key Vault, Defender, Sentinel and Activity Logs; GCP IAM, service accounts, VPC, Cloud Logging, KMS and Security Command Center; Docker and Kubernetes security.","booksStr":"AWS Skill Builder; Microsoft Learn Azure; Google Cloud Skills Boost; provider security documentation; Kubernetes security concepts.","coursesStr":"Hackers-Arise: CCSP+ and CISSP bootcamp only as supplementary governance content. Main study must use provider labs and official docs.","practicalStr":"Build a controlled cloud account/project; configure least privilege, logging and encryption; investigate supplied cloud events; track and remove billable resources.","deliverable":"Cloud security architecture diagram, IAM review and logging/monitoring assessment.","urls":[{"name":"AWS Skill Builder","url":"https://skillbuilder.aws/"},{"name":"Microsoft Learn","url":"https://learn.microsoft.com/en-us/training/azure/"},{"name":"Google Cloud Skills Boost","url":"https://www.cloudskillsboost.google/"},{"name":"Kubernetes Security","url":"https://kubernetes.io/docs/concepts/security/"}],"tools":["ScoutSuite","Prowler","CloudFox","Pacu","Trivy","Checkov","kubectl"],"commands":[{"cmd":"cloudfox aws --profile target-account-profile all-checks","desc":"Execute rapid cloud infrastructure permission and asset enumeration"},{"cmd":"prowler aws --compliance cis_aws_foundations_benchmark","desc":"Audit AWS tenant against CIS Foundations security benchmark"},{"cmd":"kubectl auth can-i create pods --as system:serviceaccount:default:sa-test","desc":"Verify RBAC permissions for Kubernetes service account"}],"subtopics":[{"title":"Cloud Identity & Access Management (IAM)","detail":"AWS IAM policies (Identity-based vs Resource-based), STS AssumeRole, Azure RBAC roles and Managed Identities, GCP IAM service account impersonation."},{"title":"Cloud Control Plane Privilege Escalation","detail":"Abusing CreatePolicyVersion, SetDefaultPolicyVersion, AttachUserPolicy, PassRole to EC2/Lambda in AWS; Contributor role abuse in Azure."},{"title":"Container & Kubernetes Security","detail":"Container breakouts via privileged containers, Docker socket mount exposure, Kubernetes RBAC misconfigurations, securing etcd and API server."}],"knowledgeAssessment":["Explain how an IAM principal with iam:PassRole and ec2:RunInstances permissions can achieve full administrative takeover.","What is an AWS Instance Profile and how does the IMDSv2 token challenge prevent SSRF credential theft?","How does an Azure Managed Identity authenticate without storing long-term credentials in code?","What risks occur when mounting the host `/var/run/docker.sock` inside a non-privileged container?"]},{"id":"mod-29","num":"29","title":"Vulnerability Research and Exploit Development Foundations","whyMatters":"Learn to understand root causes, reproduce bugs safely in toy environments and recommend fixes.","topicsStr":"C memory model; bounds errors; stack/heap; integer overflow; use-after-free; double free; format strings; race conditions; fuzzing; crash triage; debugging; patch analysis; CWE/CVE/CVSS; ASLR, DEP/NX, stack canaries and control-flow protections; responsible disclosure.","booksStr":"OST2 low-level courses; pwn.college; Google fuzzing resources; CWE catalogue; Project Zero technical research; secure coding references.","coursesStr":"Hackers-Arise: x86 Assembly, Exploit Development I and II, Advanced Hacking and Pentesting. Do this only after C, assembly and debugging foundations.","practicalStr":"Use toy programs and deliberately vulnerable training binaries; fuzz a local sample; triage a crash; explain and patch the underlying bug.","deliverable":"Vulnerability root-cause report, safe reproducer and remediation patch for a toy program.","urls":[{"name":"pwn.college","url":"https://pwn.college/"},{"name":"Google Fuzzing","url":"https://google.github.io/fuzzing/"},{"name":"CWE","url":"https://cwe.mitre.org/"},{"name":"Project Zero","url":"https://github.com/googleprojectzero"}],"tools":["GDB (pwndbg/gef)","pwntools","AFL++","Ropper","checksec","Compiler Explorer"],"commands":[{"cmd":"checksec --file=./target_binary","desc":"Inspect binary protections (RELRO, Stack Canary, NX, PIE, Fortify)"},{"cmd":"ropper --file ./target_binary --search \"pop rdi; ret\"","desc":"Search binary for Return-Oriented Programming (ROP) gadgets"},{"cmd":"afl-fuzz -i testcases/ -o findings/ -- ./target_binary @@","desc":"Run AFL++ coverage-guided fuzzing on binary with test input corpus"}],"subtopics":[{"title":"Memory Corruption Vulnerability Classes","detail":"Stack buffer overflows, heap metadata corruption, Use-After-Free (UAF), Double Free, Integer Overflows leading to signed/unsigned bounds errors."},{"title":"Binary Mitigation Mechanics","detail":"Address Space Layout Randomization (ASLR), Data Execution Prevention (DEP / NX), Stack Canaries (__stack_chk_fail), Full RELRO."},{"title":"Modern Exploit Techniques (ROP)","detail":"Return-Oriented Programming (ROP), chaining gadgets to set up register arguments, calling mprotect or VirtualProtect to bypass NX."}],"knowledgeAssessment":["Explain why Stack Canaries fail to protect against arbitrary read/write vulnerabilities.","How does Return-Oriented Programming (ROP) bypass Data Execution Prevention (DEP/NX)?","What causes a Use-After-Free vulnerability at the heap allocation level?","Explain how an integer overflow can bypass a buffer size validation check."]},{"id":"mod-30","num":"30","title":"Red Team Operations and Adversary Emulation","whyMatters":"Plan and run controlled, threat-informed simulations that test security controls and produce actionable findings.","topicsStr":"Red Team vs pentest vs Purple Team; authorisation; objectives; rules of engagement; threat intelligence; adversary selection; ATT&CK mapping; emulation design; infrastructure security; operational safety; test execution; telemetry; detection validation; evidence; remediation; retest and executive reporting.","booksStr":"MITRE ATT&CK; CALDERA; Atomic Red Team; SANS SEC565 syllabus; NIST testing and risk guidance; HTB Red Team-related content.","coursesStr":"Hackers-Arise: Red Team Operator Part I, Cyber Defense from a Military Perspective, MITRE ATT&CK and Advanced Hacking and Pentesting. HTB enterprise and AD paths; TryHackMe Red Teaming path.","practicalStr":"Design an approved emulation plan for a fictional enterprise; select safe Atomic tests; collect telemetry; coordinate a Purple Team review; document detection gaps.","deliverable":"Threat-informed exercise plan, ATT&CK mapping, detection validation report and remediation plan.","urls":[{"name":"MITRE CALDERA","url":"https://caldera.mitre.org/"},{"name":"Atomic Red Team","url":"https://github.com/redcanaryco/atomic-red-team"},{"name":"ATT&CK","url":"https://attack.mitre.org/"},{"name":"SANS SEC565","url":"https://www.sans.org/cyber-security-courses/red-team-operations-adversary-emulation/"}],"tools":["CALDERA","Atomic Red Team","Sliver C2","Havoc C2","VECTR","ATT&CK Navigator"],"commands":[{"cmd":"sliver-server","desc":"Launch secure cross-platform adversary emulation and C2 server"},{"cmd":"python3 caldera.py --insecure","desc":"Start MITRE CALDERA automated adversary emulation framework"}],"subtopics":[{"title":"Threat-Informed Operation Planning","detail":"Developing operation plans based on real APT threat intelligence, setting crown-jewel objectives, creating defensive deconfliction mechanisms."},{"title":"Secure Red Team Infrastructure","detail":"Multi-tier redirectors (HTTP, DNS, SMB), frontend reverse proxies with IP filtering, separating staging from operational C2 infrastructure."},{"title":"Purple Teaming & VECTR Assessment","detail":"Collaborative testing with defensive teams, logging test cases in VECTR, measuring alert generation vs preventive control blocking."}],"knowledgeAssessment":["How does a threat-informed Red Team engagement differ fundamentally from a standard penetration test?","What is an emergency \"White Card\" in Rules of Engagement, and when is it invoked?","How does an operator configure operational redirectors to protect backend C2 server IP addresses?","What metrics demonstrate actual improvement in defensive posture following a Purple Team exercise?"]}]},{"name":"Phase 8 · Expert specialisations and original research","period":"Month 34 onward","goal":"Choose a primary speciality, publish original work and develop advanced professional judgement.","modules":[{"id":"mod-31","num":"31","title":"Advanced Malware Research","whyMatters":"Develop a specialist capability in malware family analysis and evidence-backed technical research.","topicsStr":"Family clustering; campaign correlation; configuration extraction; PE/ELF internals; memory-resident indicators; cryptographic routine recognition; behavioural analysis; YARA; detection engineering; attribution limitations; reproducible reporting.","booksStr":"REMnux, FLARE-VM, Ghidra, capa, FLOSS, YARA, CyberDefenders, vendor research reports and relevant academic papers.","coursesStr":"Hackers-Arise: Reverse Engineering Malware I–III, Ransomware Training and Memory Forensics.","practicalStr":"Analyse safe datasets, compare family behaviours, build tested rules and explain confidence/limitations.","deliverable":"Original malware research paper and reproducible detection package.","urls":[{"name":"REMnux","url":"https://docs.remnux.org/"},{"name":"Ghidra","url":"https://ghidra-sre.org/"},{"name":"YARA","url":"https://yara.readthedocs.io/"}],"tools":["Ghidra","x64dbg","IDA Pro / Free","PE-bear","YARA","FLOSS"],"commands":[{"cmd":"python3 config_extractor.py sample.bin","desc":"Extract embedded C2 server list and encryption keys from packed loader"}],"subtopics":[{"title":"Custom Crypters & Unpacking Stagers","detail":"Manual unpacking via x64dbg, locating the Original Entry Point (OEP), dumping reconstructed PE files, rebuilding Import Address Tables."},{"title":"Malware Configuration Extraction","detail":"Automating payload decryption routines in Python, extracting embedded AES keys, C2 domain lists, and campaign campaign IDs."},{"title":"Kernel-Mode Rootkit Analysis","detail":"Analyzing Windows kernel drivers (.sys), Direct Kernel Object Manipulation (DKOM), hooking the SSDT, bypassing driver signature enforcement."}],"knowledgeAssessment":["Explain the process of locating the Original Entry Point (OEP) in a packed executable using x64dbg.","How do you automate config extraction across hundreds of samples of a specific malware family?","What protections does Windows Driver Signature Enforcement (DSE) provide, and how have adversaries bypassed it (BYOVD)?","What is the difference between an inline hook and an IAT hook?"]},{"id":"mod-32","num":"32","title":"Advanced DFIR and Threat Hunting","whyMatters":"Investigate complex incidents across endpoint, network, identity and cloud telemetry.","topicsStr":"Enterprise collection; timeline correlation; memory/disk/network correlation; identity compromise; cloud incidents; hypothesis-driven hunting; detection engineering; evidence integrity; attribution confidence; executive and technical reporting.","booksStr":"Velociraptor; Volatility 3; Autopsy; KAPE; Plaso; Timesketch; CyberDefenders; NIST/CISA guidance.","coursesStr":"Hackers-Arise: Advanced Digital Forensics, Memory Forensics, Network Forensics, Incident Response and Investigating a Cyber Attack.","practicalStr":"Complete multi-source investigation challenges and write reproducible incident timelines with evidence citations.","deliverable":"Full DFIR case study and threat-hunting playbook.","urls":[{"name":"Velociraptor","url":"https://docs.velociraptor.app/"},{"name":"Volatility","url":"https://volatility3.readthedocs.io/"},{"name":"CyberDefenders","url":"https://cyberdefenders.org/"}],"tools":["Velociraptor","Timesketch","Plaso","Volatility 3","KAPE"],"commands":[{"cmd":"timesketch_importer --sketch_id 1 -n 'Investigation' timeline.plaso","desc":"Upload multi-source timeline into Timesketch for collaborative investigation"}],"subtopics":[{"title":"Enterprise-Wide Forensic Hunts","detail":"Writing custom VQL artifacts for Velociraptor, hunting across distributed fleets for ephemeral adversary presence."},{"title":"Multi-Source Timeline Correlation","detail":"Aligning CloudTrail, Azure sign-in logs, host MFT records, and network flows into a single unified chronological narrative."},{"title":"Cloud & Container DFIR","detail":"Acquiring memory from running Kubernetes pods, analyzing AWS EBS snapshot volumes, carving AWS CloudTrail for stolen session usage."}],"knowledgeAssessment":["How do you establish evidence integrity when analyzing virtual machine snapshots and cloud storage volumes?","Explain how clock skew between servers is calculated and normalized during forensic timeline construction.","What artifacts indicate token theft in a hybrid Azure AD / Entra ID compromise?","How do you prove that an attacker successfully accessed specific sensitive files rather than merely enumerating the directory?"]},{"id":"mod-33","num":"33","title":"Mobile and IoT Security","whyMatters":"Understand mobile application, firmware, embedded and wireless security at a specialist level.","topicsStr":"Android architecture, APK, manifest, permissions, Binder, sandbox, Keystore; iOS sandbox, entitlements, Keychain and code signing; firmware; UART, JTAG, SPI, I2C; MQTT, CoAP, BLE, Zigbee; secure boot; mobile/IoT forensics.","booksStr":"OWASP MAS, MASTG, embedded application security guidance, vendor firmware docs and controlled device labs.","coursesStr":"Hackers-Arise: Mobile Hacking, Android Hacking, Mobile Forensics, Bluetooth Hacking, IoT Hacking, IP Camera Hacking, Smart Home Hacking, Car Hacking and Drone Hacking. Treat RF/satellite/cellular courses as separate advanced specialisations.","practicalStr":"Use emulators, intentionally vulnerable mobile apps, owned development boards and firmware images released for research. Do not test third-party devices without permission.","deliverable":"Mobile or IoT security assessment with reproducible evidence and remediation.","urls":[{"name":"OWASP MAS","url":"https://mas.owasp.org/"},{"name":"OWASP MASTG","url":"https://github.com/OWASP/owasp-mastg"},{"name":"OWASP Embedded","url":"https://owasp.org/www-project-embedded-application-security/"}],"tools":["MobSF","Frida","Objection","Binwalk","Ghidra","APKTool"],"commands":[{"cmd":"binwalk -Me firmware.bin","desc":"Extract embedded filesystem, bootloader, and compressed kernels from firmware image"},{"cmd":"frida -U -f com.example.app -l hook.js --no-pause","desc":"Launch Android app under instrumentation and hook target crypto methods"},{"cmd":"objection -g com.example.app explore","desc":"Interactive mobile security exploration and SSL pinning bypass"}],"subtopics":[{"title":"Android / iOS Security Model","detail":"App sandboxing, UID separation, IPC via Binder, Android Keystore vs iOS Secure Enclave, certificate pinning."},{"title":"Dynamic Instrumentation with Frida","detail":"Hooking Java and native C functions in real-time, bypassing biometrics, intercepting encrypted network traffic."},{"title":"Firmware Reverse Engineering & Hardware Debugging","detail":"Carving firmware images with binwalk, identifying hardcoded credentials, inspecting UART/JTAG serial pinouts on PCBs."}],"knowledgeAssessment":["How does Frida hook native shared library functions in an Android application?","Explain the difference between Android Keystore hardware-backed keys and software-backed keys.","What security risks arise from leaving a UART root console enabled on an IoT device's circuit board?","How do developers implement robust certificate pinning, and how can an analyst bypass it in an authorized assessment?"]},{"id":"mod-34","num":"34","title":"Supply Chain and CI/CD Security","whyMatters":"Understand how code, dependencies, build systems and artifacts can introduce security risk.","topicsStr":"Dependency confusion and typosquatting concepts; package registries; CI/CD identity; GitHub Actions; GitLab CI; secrets; build provenance; signing; SBOM; SLSA; Sigstore; container image security; artifact integrity; pipeline logging.","booksStr":"OWASP CI/CD Top 10; SLSA; Sigstore; CISA SBOM resources; GitHub and GitLab security docs.","coursesStr":"Use Hackers-Arise infrastructure and risk-management courses only as supplementary context; primary learning comes from standards and vendor documentation.","practicalStr":"Build a sample pipeline for a toy project; generate an SBOM; sign an artifact; review permissions and secret handling.","deliverable":"CI/CD threat model, SBOM and pipeline hardening report.","urls":[{"name":"OWASP CI/CD Top 10","url":"https://owasp.org/www-project-top-10-ci-cd-security-risks/"},{"name":"SLSA Framework","url":"https://slsa.dev/"},{"name":"Sigstore","url":"https://www.sigstore.dev/"},{"name":"CISA SBOM","url":"https://www.cisa.gov/sbom"}],"tools":["Syft","Grype","Cosign","Semgrep","Checkov","Trivy"],"commands":[{"cmd":"syft packages target-image:latest -o spdx-json=sbom.json","desc":"Generate Software Bill of Materials (SBOM) in SPDX JSON format"},{"cmd":"cosign sign --key cosign.key target-image:latest","desc":"Digitally sign container image artifact with cryptographic signature"},{"cmd":"semgrep scan --config p/ci-cd .","desc":"Scan CI/CD configuration files for insecure runner privileges and secret leaks"}],"subtopics":[{"title":"CI/CD Pipeline Attack Vectors (OWASP Top 10)","detail":"Poisoned Pipeline Execution (PPE), runner compromise, insecure runner permissions (GITHUB_TOKEN write access), artifact tampering."},{"title":"Dependency Attacks & Package Registries","detail":"Dependency confusion, typosquatting, malicious open-source package updates, automated lockfile poisoning."},{"title":"SLSA & Cryptographic Supply Chain Integrity","detail":"Supply chain Levels for Software Artifacts (SLSA), generating tamper-evident build provenance, signing with Sigstore/Cosign."}],"knowledgeAssessment":["Explain how Dependency Confusion attacks trick build systems into pulling untrusted public packages.","What is Poisoned Pipeline Execution (PPE) and how does a contributor exploit unreviewed pull request workflows?","How does cryptographic artifact signing with Cosign prevent registry compromise from deploying malicious images?","What is the difference between an SBOM and a standard dependency manifest?"]},{"id":"mod-35","num":"35","title":"Cryptography and Post-Quantum Cryptography","whyMatters":"Build mathematical and practical understanding of modern cryptography and migration to post-quantum standards.","topicsStr":"Number theory; modular arithmetic; finite fields; RSA; Diffie-Hellman; ECC; signatures; hashes; HMAC; TLS; PKI; quantum computing basics; Shor and Grover concepts; lattices; ML-KEM; ML-DSA; SLH-DSA; hybrid key exchange; crypto agility and migration planning.","booksStr":"NIST PQC project and standards; CryptoHack for practice; RFCs; introductory number theory and cryptography texts.","coursesStr":"Hackers-Arise: Cryptography Basics, Intermediate Cryptography and Preparing Your Network for the Post-Quantum World.","practicalStr":"Complete cryptography exercises; inspect TLS configurations; build a PQC inventory and migration assessment for a fictional organisation.","deliverable":"PQC migration report with algorithm inventory, risk assessment and recommendations.","urls":[{"name":"NIST PQC Project","url":"https://csrc.nist.gov/projects/post-quantum-cryptography"},{"name":"CryptoHack","url":"https://cryptohack.org/"},{"name":"RFC Editor","url":"https://www.rfc-editor.org/"}],"tools":["OpenSSL 3.x","CryptoHack","testssl.sh","CyberChef","SageMath"],"commands":[{"cmd":"openssl list -kem-algorithms","desc":"Display post-quantum Key Encapsulation Mechanisms supported in OpenSSL 3.x"},{"cmd":"testssl.sh --pqc https://target.com","desc":"Audit target TLS web server for post-quantum hybrid key exchange support"}],"subtopics":[{"title":"Classical Cryptographic Foundations","detail":"RSA factoring hardness, Discrete Logarithm problem, Elliptic Curve Cryptography (ECDH, ECDSA), AES-GCM authenticated encryption."},{"title":"Quantum Threat & Shor's Algorithm","detail":"How Shor's algorithm polynomial-time breaks RSA and ECC, Grover's algorithm halving symmetric key security (AES-128 to 64-bit effective)."},{"title":"NIST Post-Quantum Cryptography Standards","detail":"ML-KEM (formerly Kyber, lattice-based KEM), ML-DSA (formerly Dilithium), SLH-DSA (stateless hash-based signatures), Hybrid key exchange (X25519 + ML-KEM)."}],"knowledgeAssessment":["Why does Shor's algorithm threaten public key algorithms like RSA and ECC, but not symmetric algorithms like AES-256?","Explain the concept of 'Harvest Now, Decrypt Later' (HNDL) and why it demands immediate migration planning.","How does a hybrid key exchange (e.g. X25519Kyber768) provide security even if one of the algorithms contains an undiscovered flaw?","What is Crypto-Agility and how should an enterprise design architectures to support rapid algorithm replacement?"]},{"id":"mod-36","num":"36","title":"Research, Reporting and Professional Leadership","whyMatters":"Turn technical capability into reliable research, sound assessments and clear communication.","topicsStr":"Research methodology; literature review; evidence quality; attribution confidence; reproducibility; technical writing; responsible disclosure; threat modelling; risk management; architecture review; programme design; Purple Team governance; executive communication; conference talks and publication.","booksStr":"MITRE, CISA, vendor research, academic papers via Google Scholar/arXiv, NIST and professional reporting examples.","coursesStr":"Hackers-Arise: CISSP, CCSP+, Security Awareness and Risk Management, Cyber Law and relevant leadership courses as supplementary material.","practicalStr":"Publish an evidence-backed research article; present findings to a technical and non-technical audience; maintain a reproducible portfolio.","deliverable":"Public research portfolio, presentation and final professional capstone.","urls":[{"name":"Google Scholar","url":"https://scholar.google.com/"},{"name":"arXiv","url":"https://arxiv.org/"},{"name":"NIST CSF","url":"https://www.nist.gov/cyberframework"}],"tools":["Obsidian","Pandoc","LaTeX / Typst","Zotero","Git"],"commands":[{"cmd":"pandoc report.md -o report.pdf --pdf-engine=xelatex --toc","desc":"Compile professional markdown research report into high-fidelity PDF"}],"subtopics":[{"title":"Rigorous Technical Research & Reproducibility","detail":"Literature review methodology, maintaining proof-of-concept integrity, responsible disclosure processes with CERT/CC and vendors."},{"title":"Executive Communication & Strategic Influence","detail":"Translating technical vulnerabilities into business impact, explaining residual risk to Board members, designing security roadmaps."},{"title":"Security Program Design & Purple Team Governance","detail":"Building continuous assessment programs, coordinating Red, Blue, and Architecture teams, establishing defense-in-depth."}],"knowledgeAssessment":["How do you communicate a critical zero-day vulnerability to an executive team without causing panic or misallocating resources?","Explain the steps and ethics of coordinated vulnerability disclosure (CVD).","What distinguishes reproducible scientific cybersecurity research from vendor marketing whitepapers?","How do you design a multi-year security program that balances immediate operational firefighting with long-term architectural defense?"]}]}],
